
[General]
bypass-system = true
ipv6 = false
dns-server = system
skip-proxy = 127.0.0.1, localhost, *.local

[Rule]
DOMAIN-SUFFIX,localhost,DIRECT
DOMAIN-SUFFIX,local,DIRECT
IP-CIDR,127.0.0.0/8,DIRECT
FINAL,DIRECT

